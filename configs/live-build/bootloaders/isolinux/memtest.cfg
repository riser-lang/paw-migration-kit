label memtest86
  menu label ^Memory test (Memtest86+ x64, then return to PAW Live)
  kernel /boot/memtest86+x64.bin
  append console=ttyS0,115200n8
  text help
Run a full pass with zero errors. Then reboot into PAW Live and use the
Chinese confirmation screen to record the observed pass count and error count.
A plain text log is not accepted as machine proof.
  endtext
