name: prehardware-prepare-smoke
on:
  push:
    branches:
      - vm/ds-final-prehardware-remediation-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils gdisk e2fsprogs util-linux
      - name: Download cloud image
        run: |
          mkdir -p "$RUNNER_TEMP/cloud"
          cd "$RUNNER_TEMP/cloud"
          curl -fL --retry 5 -o SHA256SUMS https://cloud-images.ubuntu.com/releases/24.04/release/SHA256SUMS
          curl -fL --retry 5 -o ubuntu.img https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
          grep -E 'ubuntu-24.04-server-cloudimg-amd64\.img$' SHA256SUMS > selected
          sha256sum -c selected
      - name: Prepare images
        run: |
          mkdir -p "$RUNNER_TEMP/prep"
          sudo -E env PATH="$PATH" tests/prehardware/prepare-images.sh "$RUNNER_TEMP/prep" \
            --cloud-image "$RUNNER_TEMP/cloud/ubuntu.img" --force 2>&1 | tee "$RUNNER_TEMP/prepare.log"
      - name: Show result
        if: always()
        run: |
          cat "$RUNNER_TEMP/prep/boot/image-preparation.txt" 2>/dev/null || true
          tail -40 "$RUNNER_TEMP/prepare.log" 2>/dev/null || true
