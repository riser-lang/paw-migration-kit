name: PAW live build and isolated tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The original development branch and this clean-handover branch can be
  # verified independently; a shared group would queue one behind a stalled
  # run on the other branch.
  group: paw-live-build-and-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out sanitized migration kit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check runner storage budget
        shell: bash
        run: |
          set -euo pipefail
          available_kb="$(df --output=avail -k "$RUNNER_TEMP" | tail -n1 | tr -d ' ')"
          echo "Available runner storage: ${available_kb} KiB"
          if (( available_kb < 8000000 )); then
            echo 'Less than 8 GiB available; refusing to start the image build.' >&2
            exit 1
          fi

      - name: Install bounded build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash shellcheck python3 python3-yaml jq \
            gpgv gnupg debian-archive-keyring curl unzip xorriso squashfs-tools \
            debootstrap syslinux-utils isolinux \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            qemu-system-x86 qemu-utils \
            gdisk cloud-guest-utils e2fsprogs zstd pv smartmontools \
            openssh-client iproute2 iputils-ping dnsutils ethtool \
            pciutils usbutils lshw lm-sensors nvme-cli rsync less \
            memtest86+ parted util-linux gcc libc6-dev \
            busybox-static cpio xz-utils
          sudo apt-get clean
          df -h "$RUNNER_TEMP"

      - name: Install Debian Trixie live-build toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo 'Acquire::Check-Valid-Until "false";' | sudo tee /etc/apt/apt.conf.d/99paw-snapshot >/dev/null
          echo 'deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://snapshot.debian.org/archive/debian/20261101T000000Z trixie main' | sudo tee /etc/apt/sources.list.d/paw-live-build.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends live-build=1:20250505+deb13u1
          lb --version
          sudo rm -f /etc/apt/sources.list.d/paw-live-build.list
          sudo rm -f /etc/apt/apt.conf.d/99paw-snapshot
          sudo apt-get clean

      - name: Static, syntax, PowerShell, config, and public-safety checks
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --severity=error scripts/*.sh scripts/ci/*.sh tests/qemu/*.sh
          for file in scripts/*.sh scripts/ci/*.sh tests/qemu/*.sh tests/prehardware/*.sh; do bash -n "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          for path in list(Path('scripts').rglob('*.py')) + list(Path('tests/qemu').glob('*.py')) + list(Path('tests/prehardware').glob('*.py')):
              compile(path.read_bytes(), str(path), 'exec')
          print('Python source compile PASS')
          PY
          pwsh -NoLogo -NoProfile -Command '$files = Get-ChildItem scripts -Filter *.ps1 -Recurse; foreach ($f in $files) { $t=$null; $e=$null; [System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$t,[ref]$e) | Out-Null; if ($e) { $e | ForEach-Object { Write-Error $_ }; exit 1 } }; Write-Output "PowerShell parse PASS ($($files.Count) files)"'
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('configs').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          workflow = yaml.safe_load(Path('.github/workflows/build-live-and-test.yml').read_text(encoding='utf-8'))
          assert isinstance(workflow, dict) and 'jobs' in workflow
          for path in Path('boot').glob('*'):
              if path.suffix in {'.service', '.mount', '.network'}:
                  sections = [line.strip() for line in path.read_text(encoding='utf-8').splitlines() if line.strip().startswith('[') and line.strip().endswith(']')]
                  expected = '[Match]' if path.suffix == '.network' else '[Unit]'
                  assert sections and sections[0] == expected, f'Invalid unit structure: {path}'
          isolinux = Path('configs/live-build/bootloaders/isolinux/isolinux.cfg').read_text(encoding='utf-8')
          assert any(line.strip().lower().startswith('timeout ') and int(line.split()[1]) > 0 for line in isolinux.splitlines()), 'ISOLINUX must auto-boot without a keyboard'
          print('JSON, workflow YAML, and systemd unit structure PASS')
          PY
          python3 scripts/ci/check-public-safety.py .
          python3 scripts/ci/check-public-history.py .
          pwsh -NoLogo -NoProfile -File scripts/windows-static-check.ps1 -Root "$PWD"

      - name: Run console-font fail-closed gate fault injection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/ci/font-gate-tests.py --out "$PWD/artifacts"

      - name: Verify signed Debian base image and official hash manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/verify-debian-base.sh

      - name: Stage signature-verified Tailscale and Xray clients
        shell: bash
        run: |
          set -euo pipefail
          sudo env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/stage-verified-tools.sh

      - name: Build minimal Debian Live ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo env PAW_BUILD_WORK="$RUNNER_TEMP/paw-live-build" scripts/build-debian-live.sh 2>&1 | tee artifacts/live-build.log
          test -s boot/custom/paw-live-amd64.iso
          xorriso -indev boot/custom/paw-live-amd64.iso -toc >/dev/null
          sha256sum boot/custom/paw-live-amd64.iso > artifacts/paw-live-amd64.iso.sha256
          stat -c 'iso_bytes=%s' boot/custom/paw-live-amd64.iso > artifacts/iso-identity.txt
          sha256sum boot/custom/paw-live-amd64.iso >> artifacts/iso-identity.txt
          cat artifacts/iso-identity.txt
          cp boot/custom/paw-live-amd64.iso artifacts/
          cat configs/live-build/package-lists/paw.list.chroot > artifacts/software-packages.txt
          cat artifacts/software-manifest.txt >> artifacts/software-packages.txt
          cp boot/custom/software-packages.lock artifacts/software-packages.lock
          cp boot/custom/build-provenance.txt artifacts/build-provenance.txt
          fw_pkg="$(awk '$1=="firmware-realtek"{print $0}' boot/custom/software-packages.lock || true)"
          test -n "$fw_pkg"
          fw_ver="$(awk '{print $2}' <<<"$fw_pkg")"
          fw_chroot_files="$(dpkg-query --admindir="$RUNNER_TEMP/paw-live-build/chroot/var/lib/dpkg" -L firmware-realtek | grep -E 'rtl_nic/.*\.fw' || true)"
          test -n "$fw_chroot_files"
          iso_mnt="$RUNNER_TEMP/paw-iso-fw-verify"
          mkdir -p "$iso_mnt"
          sudo mount -o loop,ro boot/custom/paw-live-amd64.iso "$iso_mnt"
          fw_squashfs_files="$(sudo unsquashfs -ll "$iso_mnt/live/filesystem.squashfs" | grep -E '(^|/)(usr/)?lib/firmware/rtl_nic/.*\.fw' || true)"
          sudo umount "$iso_mnt"
          rmdir "$iso_mnt"
          test -n "$fw_squashfs_files"
          {
            echo "package_lock=$fw_pkg"
            echo "version=$fw_ver"
            echo "status=INSTALLED_AND_VERIFIED_IN_ISO_SQUASHFS"
            echo "chroot_file_count=$(wc -l <<<"$fw_chroot_files")"
            echo "squashfs_file_count=$(wc -l <<<"$fw_squashfs_files")"
            echo "--- chroot_rtl_nic_files ---"
            printf '%s\n' "$fw_chroot_files"
            echo "--- iso_squashfs_rtl_nic_files ---"
            printf '%s\n' "$fw_squashfs_files"
          } > artifacts/firmware-realtek-report.txt
          cat artifacts/firmware-realtek-report.txt
          df -h "$RUNNER_TEMP"

      - name: Validate generated CJK console font
        shell: bash
        run: |
          set -euo pipefail
          font_dir="$RUNNER_TEMP/paw-live-build/chroot/opt/paw-migration/fonts"
          unifont="$RUNNER_TEMP/paw-live-build/chroot/usr/share/unifont/unifont.hex"
          version="$(awk '$1=="unifont"{print $2}' boot/custom/software-packages.lock | head -n1)"
          test -s "$RUNNER_TEMP/paw-live-build/chroot/opt/paw-migration/scripts/paw-atomic-write.py"
          test -s "$RUNNER_TEMP/paw-live-build/chroot/opt/paw-migration/scripts/paw-tty-lib.sh"
          PAW_ARTIFACT_DIR="$PWD/artifacts" \
          PAW_CJK_FONT="$font_dir/paw-cjk-16x16.psf" \
          PAW_CJK_FALLBACK="$font_dir/paw-cjk-8x16.psf" \
          PAW_UNIFONT_HEX="$unifont" \
          PAW_UNIFONT_VERSION="$version" \
            scripts/ci/run-cjk-font-tests.sh

      - name: Boot ISO with SeaBIOS and TCG
        shell: bash
        run: |
          set -euo pipefail
          sudo env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/qemu-live-smoke.sh "$PWD/boot/custom/paw-live-amd64.iso"

      - name: Run framebuffer CJK tty1 display and keyboard suite
        shell: bash
        run: |
          set -euo pipefail
          sudo env PAW_ARTIFACT_DIR="$PWD/artifacts" \
            PAW_CJK_ISO="$PWD/boot/custom/paw-live-amd64.iso" \
            scripts/ci/run-cjk-qemu-tests.sh

      - name: Exercise PAWDATA layout and persistence on virtual media
        shell: bash
        run: |
          set -euo pipefail
          sudo env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-pawdata-virtual-tests.sh

      - name: Run isolated virtual disk and fault-injection suite
        shell: bash
        run: |
          set -euo pipefail
          sudo env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-virtual-tests.sh

      - name: Run offline repair and rollback suite on loop ext4
        shell: bash
        run: |
          set -euo pipefail
          sudo env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-repair-virtual-tests.sh

      - name: Run network and staged connectivity suite
        shell: bash
        run: |
          set -euo pipefail
          sudo env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-network-virtual-tests.sh

      - name: Run P0 and P1 audit-remediation suites
        shell: bash
        run: |
          set -euo pipefail
          env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-p0-remediation-tests.sh
          env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-p1-remediation-tests.sh

      - name: Run SSD stable identity and read-only health gate suite
        shell: bash
        run: |
          set -euo pipefail
          env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-ssd-health-tests.sh

      - name: Run VLESS/Tailscale network-bootstrap suite
        shell: bash
        run: |
          set -euo pipefail
          env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-vless-network-tests.sh \
            | tee artifacts/vless-network-test-report.txt

      - name: Run finalize/reboot and tty1 virtual suites
        shell: bash
        run: |
          set -euo pipefail
          env PAW_ARTIFACT_DIR="$PWD/artifacts" scripts/ci/run-finalize-virtual-tests.sh
          env PAW_ARTIFACT_DIR="$PWD/artifacts" PAW_REQUIRE_PTY=1 scripts/ci/run-tty-virtual-tests.sh

      - name: Summarize real test counts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            artifacts/pawdata-virtual-test-report.txt \
            artifacts/virtual-fault-injection-report.txt \
            artifacts/repair-virtual-test-report.txt \
            artifacts/network-virtual-test-report.txt \
            artifacts/p0-remediation-report.txt \
            artifacts/p1-remediation-report.txt \
            artifacts/ssd-identity-test-report.txt \
            artifacts/vless-network-test-report.txt \
            artifacts/finalize-virtual-test-report.txt \
            artifacts/tty-virtual-test-report.txt \
            artifacts/cjk-font-test-report.txt \
            artifacts/qemu-cjk-test-report.txt \
            artifacts/font-gate-test-report.txt; do
            if [[ -f "$file" ]]; then
              echo "===== $file"
              tail -n 4 "$file"
            else
              echo "MISSING $file"
            fi
          done | tee artifacts/test-summary.txt
          echo "Static/syntax, QEMU smoke and ISO build logs are in the retained artifacts."

      - name: Upload reviewed build and test outputs (3-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paw-live-build-test-results
          path: |
            artifacts/paw-live-amd64.iso
            artifacts/paw-live-amd64.iso.sha256
            artifacts/iso-identity.txt
            artifacts/debian-base-verification.txt
            artifacts/software-manifest.txt
            artifacts/software-packages.txt
            artifacts/software-packages.lock
            artifacts/firmware-realtek-report.txt
            artifacts/build-provenance.txt
            artifacts/live-build.log
            artifacts/qemu-smoke-report.txt
            artifacts/iso-system-area.txt
            artifacts/pawdata-virtual-test-report.txt
            artifacts/virtual-fault-injection-report.txt
            artifacts/repair-virtual-test-report.txt
            artifacts/network-virtual-test-report.txt
            artifacts/p0-remediation-report.txt
            artifacts/p1-remediation-report.txt
            artifacts/vless-network-test-report.txt
            artifacts/finalize-virtual-test-report.txt
            artifacts/tty-virtual-test-report.txt
            artifacts/pty-tty-test.log
            artifacts/cjk-font-test-report.txt
            artifacts/qemu-cjk-test-report.txt
            artifacts/qemu-cjk-*.log
            artifacts/qemu-cjk/**
          # The final ISO is a release candidate artifact and must remain
          # downloadable long enough for independent checksum verification and
          # the separate 50 GiB chain workflow.
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
